name: Publish package

on:
  workflow_call:
    inputs:
      workspace:
        description: Workspace to build and publish (base, kart or havnesymboler)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - run: npm ci
      - run: npm run build
      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ inputs.workspace }}
          path: ${{ inputs.workspace }}/dist
          retention-days: 1

  publish-github-packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kystverket"
      - run: npm ci --ignore-scripts
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.workspace }}
          path: ${{ inputs.workspace }}/dist
      - run: npm publish -w ${{ inputs.workspace }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
          scope: "@kystverket"
      - run: npm ci --ignore-scripts
      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ inputs.workspace }}
          path: ${{ inputs.workspace }}/dist
      - run: rm -f .npmrc
      # Pin npm: npm@12.0.0 (current `latest`) ships without its bundled
      # `sigstore` module, breaking OIDC provenance publish. 11.18.0 is the
      # latest 11.x, supports OIDC trusted publishing (>= 11.5.1), and predates
      # the bug. See https://github.com/npm/cli/issues/9722
      - run: npm install -g npm@11.18.0
      - name: Clear auth token for OIDC
        run: echo "NODE_AUTH_TOKEN=" >> $GITHUB_ENV
      - run: npm publish -w ${{ inputs.workspace }} --access public
