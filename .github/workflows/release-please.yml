name: Release Please

on:
  push:
    branches: [main]

# Only one release-please run at a time. Never cancel an in-flight run so a
# release PR merge / publish is always allowed to finish before the next starts.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      base_release_created: ${{ steps.release.outputs.base--release_created }}
      base_version: ${{ steps.release.outputs.base--version }}
      kart_release_created: ${{ steps.release.outputs.kart--release_created }}
      kart_version: ${{ steps.release.outputs.kart--version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-base:
    needs: release-please
    if: ${{ needs.release-please.outputs.base_release_created == 'true' }}
    uses: ./.github/workflows/publish-package.yml
    with:
      workspace: base
    permissions:
      contents: read
      packages: write
      id-token: write

  publish-kart:
    needs: release-please
    if: ${{ needs.release-please.outputs.kart_release_created == 'true' }}
    uses: ./.github/workflows/publish-package.yml
    with:
      workspace: kart
    permissions:
      contents: read
      packages: write
      id-token: write

  deploy-storybook:
    needs: release-please
    if: ${{ needs.release-please.outputs.base_release_created == 'true' || needs.release-please.outputs.kart_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Installere dependencies
        run: |
          npm ci --ignore-scripts
      - name: Bygge base pakke
        run: |
          npm run build --workspace base
      - name: Eksportere statisk data
        run: node --experimental-strip-types ./base/scripts/export-ship-types-json.mjs
      - name: Bygge Storybooks
        run: |
          npm run storybook:build
          cp -r ./base/storybook-static ./github-pages-root/base
          cp -r ./kart/storybook-static ./github-pages-root/kart
      - name: Laste opp til GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./github-pages-root

  notify-slack:
    needs: [release-please, publish-base, publish-kart]
    if: |
      always() &&
      (needs.release-please.outputs.base_release_created == 'true' || needs.release-please.outputs.kart_release_created == 'true') &&
      (needs.publish-base.result == 'success' || needs.publish-base.result == 'skipped') &&
      (needs.publish-kart.result == 'success' || needs.publish-kart.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack payload
        env:
          BASE_RELEASED: ${{ needs.release-please.outputs.base_release_created }}
          BASE_VERSION: ${{ needs.release-please.outputs.base_version }}
          KART_RELEASED: ${{ needs.release-please.outputs.kart_release_created }}
          KART_VERSION: ${{ needs.release-please.outputs.kart_version }}
        run: |
          TEXT="🚢 New Styrbord release published to npm:"
          if [ "$BASE_RELEASED" = "true" ]; then
            TEXT="${TEXT}
          • \`@kystverket/styrbord\` v${BASE_VERSION}"
          fi
          if [ "$KART_RELEASED" = "true" ]; then
            TEXT="${TEXT}
          • \`@kystverket/styrbord-kart\` v${KART_VERSION}"
          fi
          jq -n --arg text "$TEXT" '{"text": $text}' > /tmp/slack-payload.json
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: /tmp/slack-payload.json
