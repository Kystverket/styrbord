name: Release Please

on:
  push:
    branches: [main]

# Only one release-please run at a time. Never cancel an in-flight run so a
# release PR merge / publish is always allowed to finish before the next starts.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      base_release_created: ${{ steps.release.outputs.base--release_created }}
      base_version: ${{ steps.release.outputs.base--version }}
      base_body: ${{ steps.release.outputs.base--body }}
      base_html_url: ${{ steps.release.outputs.base--html_url }}
      kart_release_created: ${{ steps.release.outputs.kart--release_created }}
      kart_version: ${{ steps.release.outputs.kart--version }}
      kart_body: ${{ steps.release.outputs.kart--body }}
      kart_html_url: ${{ steps.release.outputs.kart--html_url }}
      consent_release_created: ${{ steps.release.outputs.consent--release_created }}
      consent_version: ${{ steps.release.outputs.consent--version }}
      consent_body: ${{ steps.release.outputs.consent--body }}
      consent_html_url: ${{ steps.release.outputs.consent--html_url }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-base:
    needs: release-please
    if: ${{ needs.release-please.outputs.base_release_created == 'true' }}
    uses: ./.github/workflows/publish-package.yml
    with:
      workspace: base
    permissions:
      contents: read
      packages: write
      id-token: write

  publish-kart:
    needs: release-please
    if: ${{ needs.release-please.outputs.kart_release_created == 'true' }}
    uses: ./.github/workflows/publish-package.yml
    with:
      workspace: kart
    permissions:
      contents: read
      packages: write
      id-token: write

  publish-consent:
    needs: release-please
    if: ${{ needs.release-please.outputs.consent_release_created == 'true' }}
    uses: ./.github/workflows/publish-package.yml
    with:
      workspace: consent
    permissions:
      contents: read
      packages: write
      id-token: write

  deploy-storybook:
    needs: release-please
    if: ${{ needs.release-please.outputs.base_release_created == 'true' || needs.release-please.outputs.kart_release_created == 'true' || needs.release-please.outputs.consent_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Installere dependencies
        run: |
          npm ci --ignore-scripts
      - name: Bygge base pakke
        run: |
          npm run build --workspace base
      - name: Eksportere statisk data
        run: node --experimental-strip-types ./base/scripts/export-ship-types-json.mjs
      - name: Bygge Storybooks
        run: |
          npm run storybook:build
          cp -r ./base/storybook-static ./github-pages-root/base
          cp -r ./kart/storybook-static ./github-pages-root/kart
          cp -r ./consent/storybook-static ./github-pages-root/consent
      - name: Kopiere designtokens og skrift til landingssiden
        run: |
          cp ./node_modules/@kystverket/styrbord-tokens/dist/kystverket.css ./github-pages-root/
          cp -r ./base/assets/fonts ./github-pages-root/fonts
      - name: Laste opp til GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./github-pages-root

  notify-slack:
    needs: [release-please, publish-base, publish-kart, publish-consent]
    if: |
      always() &&
      (needs.release-please.outputs.base_release_created == 'true' ||
        needs.release-please.outputs.kart_release_created == 'true' ||
        needs.release-please.outputs.consent_release_created == 'true') &&
      (needs.publish-base.result == 'success' || needs.publish-base.result == 'skipped') &&
      (needs.publish-kart.result == 'success' || needs.publish-kart.result == 'skipped') &&
      (needs.publish-consent.result == 'success' || needs.publish-consent.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Bygge Slack-payload
        env:
          BASE_RELEASED: ${{ needs.release-please.outputs.base_release_created }}
          BASE_VERSION: ${{ needs.release-please.outputs.base_version }}
          BASE_BODY: ${{ needs.release-please.outputs.base_body }}
          BASE_URL: ${{ needs.release-please.outputs.base_html_url }}
          KART_RELEASED: ${{ needs.release-please.outputs.kart_release_created }}
          KART_VERSION: ${{ needs.release-please.outputs.kart_version }}
          KART_BODY: ${{ needs.release-please.outputs.kart_body }}
          KART_URL: ${{ needs.release-please.outputs.kart_html_url }}
          CONSENT_RELEASED: ${{ needs.release-please.outputs.consent_release_created }}
          CONSENT_VERSION: ${{ needs.release-please.outputs.consent_version }}
          CONSENT_BODY: ${{ needs.release-please.outputs.consent_body }}
          CONSENT_URL: ${{ needs.release-please.outputs.consent_html_url }}
        run: node .github/scripts/release-notes-to-slack.mjs "$RUNNER_TEMP/slack-payload.json"
      - name: Sende Slack-varsel
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
