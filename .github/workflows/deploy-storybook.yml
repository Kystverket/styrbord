# Workflow name
name: Storybook to GitHub Pages

on:
  workflow_dispatch:

permissions:
  packages: read
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Installere dependencies
        run: |
          npm ci --ignore-scripts
      - name: Bygge base pakke
        run: |
          npm run build --workspace base
      - name: Eksportere statisk data
        run: node --experimental-strip-types ./base/scripts/export-ship-types-json.mjs
      - name: Bygge Storybooks
        run: |
          npm run storybook:build
          cp -r ./base/storybook-static ./github-pages-root/base
          cp -r ./kart/storybook-static ./github-pages-root/kart
          cp -r ./consent/storybook-static ./github-pages-root/consent
      - name: Kopiere designtokens og skrift til landingssiden
        run: |
          cp ./node_modules/@kystverket/styrbord-tokens/dist/kystverket.css ./github-pages-root/
          cp -r ./base/assets/fonts ./github-pages-root/fonts
      - name: Laste opp til GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ./github-pages-root
