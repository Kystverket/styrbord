<!doctype html>
<html lang="nb" data-color-scheme="light" data-color="primary">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styrbord – velg pakke</title>

    <!--
      kystverket.css og fonts/ kopieres inn i github-pages-root av
      deploy-jobben, slik at denne siden bruker de samme designtokenene og
      den samme skriften som Storybookene den lenker til. Åpner du fila
      lokalt uten de to katalogene, vises den ustilt.
    -->
    <link rel="stylesheet" href="kystverket.css" />
    <style>
      @font-face {
        font-family: "Museo sans";
        src:
          url("fonts/museo-sans-300.woff2") format("woff2"),
          url("fonts/museo-sans-300.woff") format("woff");
        font-display: swap;
        font-style: normal;
        font-weight: 300;
      }

      @font-face {
        font-family: "Museo sans";
        src:
          url("fonts/museo-sans-500.woff2") format("woff2"),
          url("fonts/museo-sans-500.woff") format("woff");
        font-display: swap;
        font-style: normal;
        font-weight: 500;
      }

      @font-face {
        font-family: "Museo sans";
        src:
          url("fonts/museo-sans-700.woff2") format("woff2"),
          url("fonts/museo-sans-700.woff") format("woff");
        font-display: swap;
        font-style: normal;
        font-weight: 700;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--ds-font-family);
        font-size: var(--ds-font-size-4);
        font-weight: var(--ds-font-weight-regular);
        line-height: var(--ds-line-height-md);
        color: var(--ds-color-neutral-text-default);
        background: var(--ds-color-background-default);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--ds-size-6);
      }

      .container {
        max-width: 60rem;
        width: 100%;
      }

      .masthead {
        text-align: center;
        margin-bottom: var(--ds-size-12);
      }

      .logo {
        height: var(--ds-size-10);
        width: auto;
        margin-bottom: var(--ds-size-6);
      }

      h1 {
        color: var(--ds-color-text-default);
        font-size: var(--ds-font-size-9);
        font-weight: var(--ds-font-weight-semibold);
        line-height: var(--ds-line-height-sm);
        margin-bottom: var(--ds-size-2);
      }

      .subtitle {
        color: var(--ds-color-neutral-text-subtle);
        font-size: var(--ds-font-size-5);
      }

      .options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(20rem, 1fr));
        gap: var(--ds-size-4);
      }

      .option-card {
        background: var(--ds-color-surface-default);
        border: 1px solid var(--ds-color-border-subtle);
        border-radius: var(--ds-border-radius-md);
        padding: var(--ds-size-6);
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        gap: var(--ds-size-3);
        transition:
          background 0.1s ease-in-out,
          border-color 0.1s ease-in-out;
      }

      .option-card:hover {
        background: var(--ds-color-surface-hover);
        border-color: var(--ds-color-border-default);
      }

      .option-card:active {
        background: var(--ds-color-surface-active);
      }

      .option-card:focus-visible {
        outline: 3px solid var(--ds-color-base-default);
        outline-offset: 2px;
      }

      .option-icon {
        width: var(--ds-size-12);
        height: var(--ds-size-12);
        background: var(--ds-color-background-tinted);
        border-radius: var(--ds-border-radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--ds-font-size-7);
      }

      .option-title {
        font-size: var(--ds-font-size-5);
        font-weight: var(--ds-font-weight-medium);
        line-height: var(--ds-line-height-sm);
        color: var(--ds-color-text-default);
      }

      .option-card:hover .option-title {
        text-decoration: underline;
      }

      .option-description {
        color: var(--ds-color-neutral-text-subtle);
        font-size: var(--ds-font-size-3);
      }

      @media (prefers-reduced-motion: reduce) {
        .option-card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="masthead">
        <img
          class="logo"
          src="https://www.kystverket.no/UI/Icons/logo.svg"
          alt="Kystverket"
        />
        <h1>Styrbord</h1>
        <p class="subtitle">Velg din pakke</p>
      </div>

      <div class="options">
        <a href="base" class="option-card">
          <span class="option-icon" aria-hidden="true">📦</span>
          <h2 class="option-title">@kystverket/styrbord</h2>
          <p class="option-description">
            Kjernepakke med essensielle komponenter
          </p>
        </a>

        <a href="kart" class="option-card">
          <span class="option-icon" aria-hidden="true">🗺️</span>
          <h2 class="option-title">@kystverket/styrbord-kart</h2>
          <p class="option-description">Kartkomponenter og verktøy</p>
        </a>

        <a href="consent" class="option-card">
          <span class="option-icon" aria-hidden="true">🍪</span>
          <h2 class="option-title">@kystverket/styrbord-consent</h2>
          <p class="option-description">Samtykke for informasjonskapsler</p>
        </a>

        <a
          href="https://kystverket.github.io/styrbord-tokens"
          class="option-card"
        >
          <span class="option-icon" aria-hidden="true">🎨</span>
          <h2 class="option-title">@kystverket/styrbord-tokens</h2>
          <p class="option-description">Designtokens og temaer</p>
        </a>
      </div>
    </div>
  </body>
</html>
